{% extends 'homepage/base.html'%}
{% load static%}

{% block extra_css%}
<title>
  Reset Password
</title>
{%endblock%}

{% block content %}
<div class="form">
  <div class="form-wrapper">
    <div class="form-head">
      <h1>
        FORGET PASSWORD?
      </h1>
    </div>

    <div class="fields-wrapper">

      <div class="field-wrapper">

        <form method="POST">
          {%csrf_token%}

          <div>
            <input class="input-field" required type="password" name="password">
            <label class="field-name"> Password</label>
          </div>

          <div>
            <input class="input-field" required type="password" name="confirm-password">
            <label class="field-name"> Confirm Password</label>
          </div>

          <button class="submit-btn" type="submit">
            Send Link
          </button>

        </form>
      </div>


      <p class="existed-acct">
        Already have an account <a href="{%url 'login'%}">Login</a>
      </p>

    </div>
  </div>
</div>

{%endblock%}
