{% extends "users/base.html" %}
{% load static%}
{% load humanize %}

{% block extra_css%}
<title>
  Withdraw Funds
</title>
{%endblock%}


{%block content%}
<div class="form-wrapper">
  <form class="withdraw-form" method="post">
    <p class="avail-balance">
      Balance: ${{dashboard.total_bal}} USD
    </p>
    {%csrf_token%}
    {{form}}
    <button class="withdraw-btn" type="submit">
      withdraw
    </button>
  </form>
</div>

{% endblock %}
